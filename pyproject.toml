[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcheck-ci"
version = "0.1.0"
description = "Regression checks for retrieval-augmented generation pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shalom Hunukumbura" }]
keywords = ["rag", "llm", "evaluation", "testing", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
ragcheck-ci = "ragcheck.cli:main"

[project.urls]
Homepage = "https://github.com/ShalomHunukumbura/ragcheck"
Issues = "https://github.com/ShalomHunukumbura/ragcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcheck"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
